name: Deploy

# Direct-upload deploys to Cloudflare Pages. Deliberately not using the
# dashboard's Git integration: that needs a browser OAuth step, and doing the
# build here means the build is reproducible and inspectable in the repo.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails the build on a type error rather than shipping it.
      - run: npm run check

      - run: npm run build

      # The résumé PDFs are the /resume pages printed to paper. Same source as
      # the site, so the download can never drift from what the page says.
      #
      # The runner's own Chrome is not used for this. `chrome --headless
      # --print-to-pdf` there resolves to old headless, which ignores
      # `@page { size: A4 }` and prints before webfonts resolve — it produced
      # US Letter pages set in DejaVu Sans and still exited 0. The script
      # asserts the page geometry for that reason.
      - run: npx playwright install --with-deps chromium

      - name: Render résumé PDFs
        run: npm run resume:pdf

      # Social cards for posts without a cover image. Same browser as above,
      # already installed, and it has to land before the upload because the
      # og:image tags in the built HTML already point at these files.
      - name: Render post social cards
        run: npm run og:cards

      - name: Deploy to Cloudflare Pages
        # v4 installs Wrangler v4 by default instead of pinning v3.90.0.
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Branch drives the environment: main is production, anything else
          # gets its own preview URL.
          command: >-
            pages deploy dist
            --project-name nickmiyasato
            --branch ${{ github.head_ref || github.ref_name }}
