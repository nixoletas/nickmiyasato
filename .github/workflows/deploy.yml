name: Deploy

# Direct-upload deploys to Cloudflare Pages. Deliberately not using the
# dashboard's Git integration: that needs a browser OAuth step, and doing the
# build here means the build is reproducible and inspectable in the repo.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails the build on a type error rather than shipping it.
      - run: npm run check

      - run: npm run build

      # The résumé PDFs are the /resume pages printed to paper. Same source as
      # the site, so the download can never drift from what the page says.
      # ubuntu-latest ships Chrome, so there is no browser to install.
      - name: Render résumé PDFs
        run: |
          npm run preview -- --port 4173 &
          for i in $(seq 1 30); do
            curl -sfo /dev/null "http://127.0.0.1:4173/resume/" && break
            sleep 1
          done

          print_pdf() {
            google-chrome \
              --headless --disable-gpu --no-sandbox \
              --no-pdf-header-footer \
              --print-to-pdf="dist/$2" \
              "http://127.0.0.1:4173$1"
          }

          print_pdf /resume/       resume.pdf
          print_pdf /pt-br/resume/ curriculo.pdf

          # A PDF that failed to render still exits 0 and leaves a stub, so
          # check the files are a plausible size before shipping them.
          for f in dist/resume.pdf dist/curriculo.pdf; do
            size=$(stat -c%s "$f")
            echo "$f: $size bytes"
            [ "$size" -gt 20000 ] || { echo "::error::$f is too small to be a real résumé"; exit 1; }
          done

      - name: Deploy to Cloudflare Pages
        # v4 installs Wrangler v4 by default instead of pinning v3.90.0.
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Branch drives the environment: main is production, anything else
          # gets its own preview URL.
          command: >-
            pages deploy dist
            --project-name nickmiyasato
            --branch ${{ github.head_ref || github.ref_name }}
